name: platform node and wallet verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "wallet/**"
      - "apps/mind-market/wallet/**"
      - "tools/e2e/**"
      - "tools/gates/check_throughput.py"
      - "tools/operations/**"
      - "tools/*.py"
      - "site/**"
      - "experiments/wwm-web-capacity/**"
      - "protocol/api/openapi-wwm-web-capacity-v1.yaml"
      - "protocol/schemas/wwm-web-capacity-v1.schema.json"
      - "protocol/vectors/wwm-web-capacity-v1/**"
      - "tools/lan_testnet.py"
      - "deploy/host_lifecycle.py"
      - "deploy/test_host_lifecycle.py"
      - ".github/workflows/platform-node-and-wallet.yml"

permissions:
  contents: read

jobs:
  host-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.5"
      - name: Verify signed host lifecycle
        working-directory: deploy
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "cryptography==49.0.0"
          python -m unittest -v test_host_lifecycle.py

  worker-security-contracts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.5"
      - name: Verify encrypted worker custody and sandbox enforcement
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "cryptography==49.0.0"
          python -m unittest -v \
            tools.test_worker_payout_identity \
            tools.test_compute_worker_network \
            tools.test_worker_sandbox

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
          - runner: macos-14
            platform: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.4.1"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustc -vV
      - name: Build and test native node surface
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p noos-node --bin noosd
          cargo build --locked --release -p noos-indexer --bin noos-indexer
          cargo build --locked --release -p noos-cli --bin noos-cli
          cargo test --locked -p noos-node --lib -- --test-threads=1
          cargo test --locked -p noos-lumen
          cargo test --locked -p noos-cli
      - name: Test mobile wallet SDK boundary
        shell: bash
        run: cargo test --locked -p noos-wallet-sdk
      - name: Reject stale mobile wallet bindings
        shell: bash
        run: python wallet/mobile/build_bindings.py verify --profile release
      - name: Exercise deterministic throughput report contract
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p noos-node --bin noos-throughput
          mkdir -p platform-evidence/windows
          # GitHub-hosted CPU allocation and noisy-neighbor load are not a
          # registered benchmark environment. Exercise the full release
          # workload, deterministic commitments, authorization paths, and
          # report evaluator here without turning hosted-runner timing into a
          # performance claim. Formal floors run on preregistered controlled
          # hardware and retain this same JSON contract.
          set +e
          python tools/gates/check_throughput.py \
            --binary target/release/noos-throughput.exe \
            --samples 2 \
            --transactions 10000 \
            --accounts 1024 \
            --minimum-validator-tps 1 \
            --minimum-producer-tps 1 \
            --minimum-durable-producer-tps 1 \
            --minimum-durable-validator-tps 1 \
            --maximum-root-share 0.99 \
            --maximum-sample-spread 0.99 \
            --internal-equivalents 4294967296 \
            --internal-accounts 65536 \
            --minimum-internal-equivalents-per-second 1 \
            --minimum-internal-sample-seconds 0.01 \
            --out platform-evidence/windows/throughput-contract-smoke.json
          status=$?
          set -e
          python -m json.tool platform-evidence/windows/throughput-contract-smoke.json
          exit "${status}"
      - name: Run native node boot smoke
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=".exe"; fi
          "target/release/noosd${suffix}" --version
          "target/release/noosd${suffix}" --help | grep -- "--devnet-witness"
          python tools/lan_testnet.py init --root "${RUNNER_TEMP}/mindchain-lan"
      - name: Validate macOS one-click onboarding
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: zsh -n tools/operator_onboard.command
      - name: Build native desktop wallet UI
        shell: bash
        run: node wallet/app/build.mjs
      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version 2.9.6 --locked
      - name: Build native wallet bundle
        shell: bash
        working-directory: wallet/app/src-tauri
        run: cargo tauri build --features gui
      - name: Record platform evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "platform-evidence/${{ matrix.platform }}"
          rustc -vV > "platform-evidence/${{ matrix.platform }}/rustc.txt"
          uname -a > "platform-evidence/${{ matrix.platform }}/uname.txt" || ver > "platform-evidence/${{ matrix.platform }}/uname.txt"
          python - <<'PY'
          import hashlib, json, os, pathlib, platform
          root = pathlib.Path("target/release")
          suffix = ".exe" if os.name == "nt" else ""
          files = []
          for name in ("noosd", "noos-indexer", "noos-cli"):
              path = root / (name + suffix)
              files.append({"file": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          out = {"schema": "noos/platform-build-evidence/v1", "platform": platform.platform(),
                 "machine": platform.machine(), "binaries": files}
          pathlib.Path("platform-evidence/${{ matrix.platform }}/evidence.json").write_text(json.dumps(out, indent=2) + "\n")
          PY
      - name: Collect wallet bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "platform-evidence/${{ matrix.platform }}/wallet"
          suffix=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=".exe"; fi
          mkdir -p "platform-evidence/${{ matrix.platform }}/bin"
          for name in noosd noos-indexer noos-cli; do
            cp "target/release/${name}${suffix}" "platform-evidence/${{ matrix.platform }}/bin/"
          done
          if [[ -d wallet/app/src-tauri/target/release/bundle ]]; then
            cp -R wallet/app/src-tauri/target/release/bundle/. "platform-evidence/${{ matrix.platform }}/wallet/"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mindchain-${{ matrix.platform }}-${{ github.sha }}
          path: platform-evidence/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30
  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
          - runner: windows-2025
            platform: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: "27.3.13750724"
      NOOS_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ "${{ runner.os }}" == "Windows" ]]; then sdkmanager="${sdkmanager}.bat"; fi
          yes | "${sdkmanager}" --licenses >/dev/null || true
          "${sdkmanager}" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"
      - name: Install pinned Rust and cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          cargo install cargo-ndk --version 4.1.2 --locked
          rustc -vV
          cargo ndk --version
      - name: Build Android bindings libraries and application
        shell: bash
        run: |
          set -euo pipefail
          python wallet/mobile/build_bindings.py android \
            --profile release \
            --ndk-home "${ANDROID_NDK_HOME}"
          python -m json.tool wallet/mobile/android-bindings.manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mindchain-android-${{ matrix.platform }}-${{ github.sha }}
          path: |
            wallet/mobile/android-bindings.manifest.json
            wallet/mobile/android/core/src/main/java/org/noosphere/wallet/core/noos_wallet_sdk.kt
            wallet/mobile/android/core/src/main/java/org/noosphere/wallet/core/MobileNodeSynchronizer.kt
            wallet/mobile/android/core/src/main/java/org/noosphere/wallet/core/WalletApiTransport.kt
            wallet/mobile/android/core/src/main/jniLibs/
            wallet/mobile/android/app/src/
            wallet/mobile/android/app/build.gradle.kts
            wallet/mobile/android/app/build/outputs/apk/release/*.apk
            wallet/mobile/android/core/build/outputs/aar/*.aar
            wallet/mobile/android/security/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 30

  ios:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      NOOS_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustc -vV
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/xcodegen.zip"
          install_root="${RUNNER_TEMP}/xcodegen"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          mkdir -p "${install_root}"
          unzip -q "${archive}" -d "${install_root}"
          echo "${install_root}/xcodegen/bin" >> "${GITHUB_PATH}"
      - name: Build Swift package bindings and iOS application
        shell: bash
        run: |
          set -euo pipefail
          xcodegen --version
          swift test --package-path wallet/mobile/ios
          python wallet/mobile/build_bindings.py ios --profile release
          python -m json.tool wallet/mobile/ios-bindings.manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mindchain-ios-${{ github.sha }}
          path: |
            wallet/mobile/ios-bindings.manifest.json
            wallet/mobile/ios/CoreBindings/MindChainWalletCore.swift
            wallet/mobile/ios/CoreBindings/MobileNodeSynchronizer.swift
            wallet/mobile/ios/CoreBindings/MindChainWalletCoreFFI.h
            wallet/mobile/ios/App/project.yml
            wallet/mobile/ios/App/**/*.swift
            wallet/mobile/ios/App/**/*.plist
            wallet/mobile/ios/App/**/*.entitlements
            wallet/mobile/ios/App/**/*.json
            wallet/mobile/ios/App/**/*.png
            wallet/mobile/ios/Artifacts/MindChainWalletCoreNative.xcframework/
            wallet/mobile/ios/Artifacts/AppDerivedData/Build/Products/Release-iphonesimulator/*.app/
          if-no-files-found: error
          retention-days: 30

  browser-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.4.1"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.5"
      - name: Verify browser capacity contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-capacity-evidence
          python -m pip install --disable-pip-version-check --only-binary=:all: "cryptography==49.0.0"
          python -m pip show cryptography > browser-capacity-evidence/python-cryptography.txt
          node --version | tee browser-capacity-evidence/node-version.txt
          node --test \
            site/wwm/client.test.mjs \
            site/wwm/verifier-v1.test.mjs \
            site/wwm/web-capacity.test.mjs \
            2>&1 | tee browser-capacity-evidence/node-tests.tap
          python --version 2>&1 | tee browser-capacity-evidence/python-version.txt
          python -m unittest -v \
            tools.operations.test_wwm_web_capacity \
            tools.operations.test_wwm_web_capacity_experiment \
            tools.operations.test_wwm_web_capacity_topology \
            tools.operations.test_wwm_web_capacity_vectors \
            tools.operations.test_wwm_web_capacity_devnet \
            tools.operations.test_wwm_web_capacity_pilot \
            tools.operations.test_wwm_web_capacity_resilience \
            2>&1 | tee browser-capacity-evidence/python-tests.txt
      - name: Record exact browser capacity evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path("browser-capacity-evidence")
          subjects = []
          for path in sorted(root.iterdir()):
              if path.is_file():
                  subjects.append({
                      "file": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
          evidence = {
              "schema": "noos/browser-capacity-ci-evidence/v1",
              "source_revision": os.environ["GITHUB_SHA"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "subjects": subjects,
          }
          (root / "evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mindchain-browser-capacity-${{ github.sha }}
          path: browser-capacity-evidence/
          if-no-files-found: error
          retention-days: 30

  mobile-evidence-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.5"
      - name: Verify mobile evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-evidence-contracts
          python -m pip install --disable-pip-version-check --only-binary=:all: "cryptography==49.0.0"
          python --version 2>&1 | tee mobile-evidence-contracts/python-version.txt
          python -m pip show cryptography > mobile-evidence-contracts/python-cryptography.txt
          python -m unittest -v \
            tools.operations.test_mobile_release_supply \
            tools.operations.test_mobile_device_evidence \
            tools.operations.test_mobile_release_reproduction \
            2>&1 | tee mobile-evidence-contracts/tests.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path("mobile-evidence-contracts")
          subjects = [
              {
                  "file": path.name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in sorted(root.iterdir())
              if path.is_file()
          ]
          (root / "evidence.json").write_text(
              json.dumps(
                  {
                      "schema": "noos/mobile-evidence-contract-ci/v1",
                      "source_revision": os.environ["GITHUB_SHA"],
                      "runner_os": os.environ["RUNNER_OS"],
                      "runner_arch": os.environ["RUNNER_ARCH"],
                      "subjects": subjects,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mindchain-mobile-evidence-contracts-${{ github.sha }}
          path: mobile-evidence-contracts/
          if-no-files-found: error
          retention-days: 30

  mobile-release-supply:
    needs: [native, android, ios, mobile-evidence-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mindchain-android-linux-${{ github.sha }}
          path: mobile-subjects/android-linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mindchain-android-windows-${{ github.sha }}
          path: mobile-subjects/android-windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mindchain-ios-${{ github.sha }}
          path: mobile-subjects/ios
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mindchain-windows-${{ github.sha }}
          path: mobile-subjects/native-windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mindchain-macos-${{ github.sha }}
          path: mobile-subjects/native-macos
      - name: Seal exact mobile release subjects
        shell: bash
        run: |
          set -euo pipefail
          python tools/operations/mobile_release_supply.py seal \
            --revision "${GITHUB_SHA}" \
            --input android-linux=mobile-subjects/android-linux \
            --input android-windows=mobile-subjects/android-windows \
            --input ios=mobile-subjects/ios \
            --input native-windows=mobile-subjects/native-windows \
            --input native-macos=mobile-subjects/native-macos \
            --output mobile-release
          python tools/operations/mobile_release_supply.py verify \
            --manifest mobile-release/subject-manifest.json \
            --checksums mobile-release/SHA256SUMS
      - name: Sign mobile subject provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            mobile-release/subject-manifest.json
            mobile-release/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mindchain-mobile-release-supply-${{ github.sha }}
          path: |
            mobile-release/
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
